mcarbon:"<h2>Status</h2><p>Korea declared its 2050 carbon neutrality goal in October 2020, followed by the Framework Act on Carbon Neutrality and Green Growth in September 2021 and a 2030 target of cutting greenhouse gas emissions 40% from 2018 levels. This follows the Paris Agreement (December 2015) and the IPCC 1.5°C special report (October 2018).</p>"+h3("Lighting and carbon neutrality")+ul(["Lighting is a significant share of total electricity use, so efficient lighting directly saves energy","LED, smart lighting and automatic control can cut electricity use by 50–80% compared with incandescent or fluorescent lamps","Smart building and smart city lighting, and solar-linked lighting, reduce reliance on fossil fuels","Open challenges: lower-carbon manufacturing and life-cycle environmental impact"])+h3("Issues in the lighting industry")+ul(["<b>Energy waste:</b> over 60% of public lighting power is used when no one is present, and over 80% in underground parking and public corridors","<b>No smart power monitoring:</b> little data collection or anomaly monitoring (leakage, fire)","<b>Costly to modify:</b> fixed wiring often makes smart replacement impossible without reinstallation","<b>High maintenance:</b> manual inspection labor and frequent repair or replacement"])+"<h2 style='margin-top:40px'>Solution overview</h2><p>A total carbon-reduction lighting solution.</p>"+ul(["<b>Safe power usage:</b> real-time monitoring of circuit current, voltage, power and temperature, with AI and IoT algorithms that need no debugging or networking","<b>Energy saving:</b> saves about 80% of energy, over 40% more than single-lamp induction LEDs","<b>Space energy-saving management:</b> default 50% brightness when people or vehicles are present, 1–5% when empty, adjustable by site","<b>Big data control with servers:</b> usage patterns and problem locations identified from the server, cutting on-site labor and maintenance","<b>Hardware:</b> high-efficiency LED sources, redesigned power board with up to 95% conversion efficiency, improved reflectivity and light guide","<b>Software:</b> multi-sensor data collection, Bluetooth indoor positioning, and laser radar for parking space monitoring"])+h3("Expected benefits")+ul(["Carbon reduction and energy savings through 0–100% dimming and time/space-based deep learning","Real-time monitoring detects abnormal circuits, overcurrent and overvoltage","Short installation time and easy modification without damaging existing circuits","Economic return: savings-based revenue and carbon credit trading benefits, with lower maintenance cost"])+"<h2 style='margin-top:40px'>Solution application</h2>"+h3("Smart lighting type I")+"<p>Downlights, globe lights, circular lights, lamps, panel lights, explosion-proof lighting, square lights, industrial lights.</p>"+h3("Smart lighting type II")+"<p>Track lights, spotlights, tunnel light modules, T8 / T6, industrial line lighting, streetlights.</p>"+h3("Smart lighting vs. standard LED")+tbl(["Category","Smart lighting","Standard LED"],rows(["Lighting efficiency|200 lm/W|90–110 lm/W","Light loss|2%|8–10%","Lifespan|100,000 hours|10,000–30,000 hours","Operating temp|30–45°C|55–70°C","Lighting area|Beam angle: 3m|Beam angle: 1.5m"]))+"<p>Compared with common T8 lamps, the solution saves about 263 kWh a year, cutting roughly 111 kg of carbon emissions per year.</p>"+h3("Fixture performance")+ul(["<b>High luminous efficiency:</b> a 6W lamp delivers 230 lm/W, 140% more efficient than traditional 36W fluorescent lamps","<b>Brightness:</b> optical PC body and reflective design give about 38% higher brightness","<b>Long life:</b> ripple control reduces light decay and supports over 80,000 hours","<b>Heat dissipation:</b> lamp temperature rise under 15°C"])+h3("Solution system I: on-site application and server monitoring")+"<p>All modules are integrated into the lamp tube, so installation is a lamp replacement with no circuit modification, debugging or networking. PC terminals, mobile apps and large dashboards show real-time usage, circuit-level consumption, electrical safety alerts and cumulative carbon reduction.</p>"+h3("Solution system II: self-learning and IoT")+"<p>Lights communicate and learn movement paths, detect 30–50m ahead and behind (adjustable) and dim gradually, saving over 70% of energy. At intersections, lights pre-light at 50% and dim to 5% (adjustable) once a direction is chosen. Lights can also share parking space information.</p>"+h3("Where it is deployed")+ul(["<b>Indoor:</b> offices, buildings, shopping malls, medical facilities, schools, hotels, factories, logistics warehouses, parking lots, garages and other large public spaces","<b>Outdoor:</b> parks, railways, subways, light rail, tunnels, airports, highways, parking lots, stadiums and other large public spaces"])+"<h2 style='margin-top:40px'>Case studies</h2><p>Both cases replaced 18W single lamps with IoT radar sensor lighting.</p>"+tbl(["","Case 1","Case 2"],rows(["Number of lamps|1,706 units|1,063 units","Daily consumption before|819.12 kW|460.01 kW","Minimum daily savings|593.83 kW (72.50%)|343.43 kW (74.66%)","Maximum daily savings|624.14 kW (76.20%)|353.86 kW (76.93%)","Monthly electricity savings|18,943.62 kW|10,726.76 kW"]))+"<h2 style='margin-top:40px'>Operation method</h2>"+ul(["<b>Site analysis:</b> on-site visit and power line inspection, usage estimate, expected improvements","<b>Contract signing:</b> contract type chosen to suit the site","<b>Installation and setup:</b> equipment selection and installation, lamp replacement, gateway brightness adjustment, server setup, power and data transmission testing, software validation"])+h3("Cost")+ul(["<b>Upfront cost:</b> none. All initial product and system costs are covered by INES.","<b>Settlement:</b> in the first year of the 7-year contract, monthly payments are based solely on the amount saved. From year 3 to year 7, 50% of energy cost savings go to the provider and 50% to the customer. After year 7, only maintenance and support are charged.","<b>After-sales service:</b> usage consulting, issue resolution and follow-up on-site service","Contract periods may vary by building type, site conditions, electricity use and expected savings"])+tbl(["Cost sharing","Solution provider (INES)","Customer"],rows(["Initial investment|Fully covered|No burden","Engineering and installation|Fully covered|No burden","System operation|Fully covered|No burden","Review and report of savings|INES and client|Periodic evaluations and reports"]))+"<p>In the example case (1,706 lamps, 72.50% daily saving), estimated monthly energy savings are 2,400,000 won and estimated savings for the building owner over 7 years are about 65,000,000 won, assuming a 3% annual rise in commercial electricity rates. Figures fluctuate with the business environment.</p>"
};
